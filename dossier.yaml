# The repo dossier: which documents explain this repo. Checked by `dossier check`.
# Each part: `present` with its paths, or `exempt` with a reason. `dossier new <part>` writes a template.
schema: 1
kind: cli
parts:
  identity:
    present: [branding/brand.yaml, docs/brand.md]
  purpose:
    present: [README.md]
  reasoning:
    present: [docs/extraction.md, docs/boundaries.md]
  design:
    present: [docs/architecture.md, docs/user-stories.md]
  contract:
    present: [docs/format.md]
  trust:
    present: [LICENSE, SECURITY.md, TRADEMARKS.md, docs/security-scan.md]
  help:
    present: [CONTRIBUTING.md]
  agents:
    present: [AGENTS.md, skills/atlas/SKILL.md]
